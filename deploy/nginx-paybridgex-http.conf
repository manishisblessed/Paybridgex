# Bootstrap HTTP-only nginx until DNS points here and certbot can issue TLS.
# After DNS cutover: sudo certbot --nginx -d paybridgex.in -d www.paybridgex.in
# then switch to deploy/nginx-paybridgex.conf (or let certbot rewrite this file).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name paybridgex.in www.paybridgex.in _;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
