# Paybridgex — nginx (EC2 → Node/PM2 on :3000)
# Single final domain: https://paybridgex.in
# api.paybridgex.in is an alias on the same box for partner webhooks/API callers.

# ── HTTP: ACME challenges + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name paybridgex.in www.paybridgex.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://paybridgex.in$request_uri;
    }
}

# api host on :80 — proxy for now; certbot upgrades this to HTTPS + redirect.
server {
    server_name api.paybridgex.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.paybridgex.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.paybridgex.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── HTTPS: the application ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name paybridgex.in www.paybridgex.in;

    ssl_certificate /etc/letsencrypt/live/paybridgex.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paybridgex.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for KYC docs)
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js static assets with long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint
    location /api/healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}

server {
    if ($host = api.paybridgex.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.paybridgex.in;
    return 404; # managed by Certbot


}
